# =============================================================
# docker-compose.yml
# =============================================================
# Runs the entire Trygg platform with one command:
#   docker-compose up -d
#
# Services:
#   db        — PostgreSQL database
#   scheduler — the Trygg scheduler and all agents
#
# On the Geekom, this file lives at /opt/trygg/docker-compose.yml
# and starts automatically on boot via a systemd service.
# =============================================================



services:

  # ── PostgreSQL database ────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: trygg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trygg
      POSTGRES_USER: trygg
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      # Data persists here — this directory survives container restarts
      - ./data/postgres:/var/lib/postgresql/data
      # Run the schema migration on first startup
      - ./trygg_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      # Only accessible from localhost — not exposed to the network
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trygg"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Trygg scheduler ───────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trygg-scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trygg:${DB_PASSWORD:-changeme}@db:5432/trygg
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Telegram command handler ───────────────────────────────
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trygg-telegram
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trygg:${DB_PASSWORD:-changeme}@db:5432/trygg
    command: ["python", "-m", "mimir.telegram_handler"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


